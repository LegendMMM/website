<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>我們的出門券</title>
<style>
:root{--bg:#fff8f8;--card:#fff;--ink:#2b2628;--muted:#867a80;--line:#f0dfe4;--accent:#ef6f91;--accent2:#f7b6c8;--shadow:0 18px 50px rgba(86,48,59,.10)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:linear-gradient(180deg,#fff8fb 0,#fff 42%,#fff9f7 100%);color:var(--ink)}
.wrap{max-width:980px;margin:auto;padding:28px 18px 70px}.hero{text-align:center;padding:26px 0 20px}.hero .pill{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:13px;color:var(--muted)}h1{font-size:clamp(34px,7vw,58px);margin:12px 0 6px;letter-spacing:-.04em}.sub{color:var(--muted);font-size:15px}
.people{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}.person{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:26px;padding:20px;box-shadow:var(--shadow)}.top{display:flex;align-items:center;gap:14px}.avatar{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#fff5f8;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}.name{font-size:22px;font-weight:800}.edit{margin-left:auto;border:0;background:#fff0f4;color:#b84c6a;border-radius:13px;padding:9px 12px;font-weight:700;cursor:pointer}.ticket{margin-top:18px;border:1.5px dashed #e8a8ba;border-radius:22px;padding:18px;background:linear-gradient(135deg,#fff8fb,#fff)}.ticket b{font-size:19px}.ticket p{margin:7px 0 0;color:var(--muted);font-size:14px}.ticket .stamp{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.status{font-size:13px;color:#b34b67}.use{border:0;background:var(--ink);color:white;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}.use:disabled{background:#c6bcc0;cursor:not-allowed}.counter{display:flex;align-items:center;gap:9px;margin-top:14px}.counter button{width:38px;height:38px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:22px;cursor:pointer}.count{min-width:52px;text-align:center;font-size:28px;font-weight:900}.countlabel{font-size:13px;color:var(--muted)}.section{margin-top:34px}.section h2{font-size:24px;margin-bottom:6px}.section .hint{color:var(--muted);font-size:14px;margin-bottom:14px}.places{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.place{border:1px solid var(--line);background:#fff;border-radius:19px;padding:17px 13px;cursor:pointer;text-align:left;transition:.15s;min-height:110px}.place:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.place.selected{outline:2px solid var(--accent);background:#fff7fa}.ico{font-size:27px}.place b{display:block;margin-top:8px}.place span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.custom{display:flex;gap:8px;margin-top:13px}.custom input{flex:1;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit}.custom button{border:0;background:#f8e7ec;border-radius:14px;padding:0 16px;font-weight:800;color:#8e4760}.pick{margin-top:22px;background:#2c2729;color:white;border-radius:24px;padding:21px;display:flex;gap:16px;align-items:center;justify-content:space-between}.pick small{display:block;color:#d8cfd2}.pick strong{font-size:21px}.pick button{border:0;background:white;border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer}.footer{text-align:center;color:#aa9ca1;font-size:12px;margin-top:28px}
.modal{position:fixed;inset:0;background:rgba(34,25,28,.35);display:none;place-items:center;padding:18px}.modal.show{display:grid}.panel{width:min(420px,100%);background:#fff;border-radius:24px;padding:22px}.panel h3{margin:0 0 16px}.row{display:grid;gap:7px;margin:12px 0}.row label{font-size:13px;color:var(--muted)}.row input{border:1px solid var(--line);border-radius:13px;padding:12px;font:inherit}.emoji-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.emoji-btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-size:24px;cursor:pointer}.emoji-btn.active{outline:2px solid var(--accent);background:#fff5f8}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}.actions button{border:0;border-radius:12px;padding:10px 14px;font-weight:800}.cancel{background:#f3edef}.save{background:var(--ink);color:#fff}
@media(max-width:760px){.people{grid-template-columns:1fr}.places{grid-template-columns:1fr 1fr}.wrap{padding:18px 14px 50px}.pick{align-items:flex-start;flex-direction:column}.pick button{width:100%}}
.sharebar{margin:16px auto 0;max-width:680px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}.room{font-size:13px;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:999px;padding:9px 12px}.sharebtn{border:0;background:var(--accent);color:#fff;border-radius:999px;padding:10px 14px;font-weight:800;cursor:pointer}.sync{font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero"><span class="pill">♡ TWO-PERSON DATE PASS</span><h1>我們的出門券</h1><div class="sub">想見面的時候，就拿一張券出來。</div><div class="sharebar"><span class="room" id="roomLabel">房間載入中…</span><button class="sharebtn" id="shareBtn">分享共同編輯網址</button><span class="sync" id="syncStatus">準備同步</span></div></div>
  <div class="people" id="people"></div>
  <section class="section"><h2>今天去哪裡？</h2><div class="hint">點一個地點，或加入你們自己的秘密基地。</div><div class="places" id="places"></div>
  <div class="custom"><input id="customInput" placeholder="新增自訂地點，例如：河堤散步" maxlength="24"><button id="addPlace">＋ 加入</button></div></section>
  <div class="pick"><div><small>這次約會</small><strong id="chosen">還沒決定地點</strong></div><button id="random">幫我們抽一個</button></div>
  <div class="footer">每張券都可以重新啟用。重點不是去哪，是兩個人都有出門。</div>
</div>
<div class="modal" id="modal"><div class="panel"><h3>編輯個人資料</h3><div class="row"><label>暱稱</label><input id="nameInput" maxlength="16"></div><div class="row"><label>選一個表情符號當頭貼</label><div class="emoji-grid" id="emojiGrid"></div></div><div class="actions"><button class="cancel" id="cancel">取消</button><button class="save" id="save">儲存</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
<script>
const defaults={people:[{name:'你',emoji:'🐶',count:3},{name:'對方',emoji:'🐱',count:3}],places:[['☕','咖啡廳','聊天放空'],['🍿','電影院','一起看場電影'],['🍽️','吃飯','去吃想吃很久的店'],['🛍️','逛街','商場、市集、百貨'],['🌳','公園散步','不排行程也可以'],['🌃','看夜景','晚上的小旅行'],['🎳','保齡球／遊樂場','輸的人請飲料'],['🧩','桌遊店','一起玩點東西'],['🐾','動物園／水族館','慢慢逛一下午'],['🎤','KTV','唱到沒聲音'],['🏛️','展覽／博物館','找點新東西看'],['🚗','小旅行','離開熟悉的地方']]};
const emojis=['🐶','🐱','🐰','🐻','🐼','🦊','🐯','🐸','🐧','🐥','🦄','🐹','🌷','⭐','🌙','🍓','🍑','🍰'];
let state=JSON.parse(localStorage.getItem('datePassState')||'null')||structuredClone(defaults);
if(!state.people) state.people=structuredClone(defaults.people);
state.people=state.people.map((p,i)=>({name:p.name||defaults.people[i]?.name||'未命名',emoji:p.emoji||(['🐶','🐱'][i]||'🙂'),count:Number.isFinite(p.count)?p.count:(p.used?0:1)}));
if(!state.places) state.places=structuredClone(defaults.places);
let editing=0, selected='', pickedEmoji='🐶', remoteApplying=false;
const params=new URLSearchParams(location.search);
let room=params.get('room');
if(!room){room=Math.random().toString(36).slice(2,8).toUpperCase();params.set('room',room);history.replaceState(null,'',location.pathname+'?'+params.toString()+location.hash)}
roomLabel.textContent='共同房間：'+room;
const gun=typeof Gun!=='undefined'?Gun(['https://gun-manhattan.herokuapp.com/gun']):null;
const roomNode=gun?gun.get('date-pass-v2').get(room):null;
function pushRemote(){if(!roomNode||remoteApplying)return;syncStatus.textContent='同步中…';roomNode.put({payload:JSON.stringify(state),updatedAt:Date.now()});setTimeout(()=>syncStatus.textContent='已同步',350)}
function persist(){localStorage.setItem('datePassState',JSON.stringify(state));pushRemote()}
if(roomNode){
 syncStatus.textContent='連線中…';
 roomNode.on(data=>{if(!data||!data.payload)return;try{const incoming=JSON.parse(data.payload);if(!incoming?.people||!incoming?.places)return;const a=JSON.stringify(incoming),b=JSON.stringify(state);if(a!==b){remoteApplying=true;state=incoming;localStorage.setItem('datePassState',a);renderPeople();renderPlaces();remoteApplying=false}syncStatus.textContent='已同步'}catch(e){syncStatus.textContent='同步異常'}});
 setTimeout(()=>pushRemote(),700);
}else syncStatus.textContent='離線模式';
shareBtn.onclick=async()=>{
 const url=location.href;
 if(location.protocol==='file:'){
   alert('共同編輯功能已做好，但目前這份是本機檔案。要讓對方真的打開同一個網址，需要先把網站公開部署。');
   return;
 }
 try{await navigator.clipboard.writeText(url);shareBtn.textContent='已複製網址 ✓';setTimeout(()=>shareBtn.textContent='分享共同編輯網址',1800)}catch{prompt('複製這個網址分享給對方：',url)}
};
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}
function renderPeople(){
 const el=document.getElementById('people');el.innerHTML='';
 state.people.forEach((p,i)=>{
  const d=document.createElement('div'); d.className='person';
  d.innerHTML=`<div class="top"><div class="avatar">${p.emoji}</div><div><div class="name">${escapeHtml(p.name)}</div><div style="color:var(--muted);font-size:13px">剩下 ${p.count} 張出門券</div></div><button class="edit" data-i="${i}">編輯</button></div>
  <div class="ticket"><b>🎟️ ${escapeHtml(p.name)} 的出門券</b><p>可以用一張券發起一次約會邀請。</p>
  <div class="counter"><button data-dec="${i}" aria-label="減少一張">−</button><div><div class="count">${p.count}</div><div class="countlabel">張剩餘</div></div><button data-inc="${i}" aria-label="增加一張">＋</button></div>
  <div class="stamp"><span class="status">${p.count>0?'目前可使用':'目前沒有券'}</span><button class="use" data-use="${i}" ${p.count<=0?'disabled':''}>使用 1 張</button></div></div>`;
  el.appendChild(d)
 });
 document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>openEdit(+b.dataset.i));
 document.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>changeCount(+b.dataset.inc,1));
 document.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>changeCount(+b.dataset.dec,-1));
 document.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>changeCount(+b.dataset.use,-1));
}
function changeCount(i,delta){state.people[i].count=Math.max(0,state.people[i].count+delta);persist();renderPeople()}
function renderPlaces(){const el=document.getElementById('places');el.innerHTML='';state.places.forEach((p)=>{const b=document.createElement('button');b.className='place'+(selected===p[1]?' selected':'');b.innerHTML=`<div class="ico">${p[0]}</div><b>${escapeHtml(p[1])}</b><span>${escapeHtml(p[2]||'自訂約會地點')}</span>`;b.onclick=()=>{selected=p[1];document.getElementById('chosen').textContent=p[1];renderPlaces()};el.appendChild(b)})}
function renderEmojiGrid(){const g=document.getElementById('emojiGrid');g.innerHTML='';emojis.forEach(e=>{const b=document.createElement('button');b.type='button';b.className='emoji-btn'+(e===pickedEmoji?' active':'');b.textContent=e;b.onclick=()=>{pickedEmoji=e;renderEmojiGrid()};g.appendChild(b)})}
function openEdit(i){editing=i;const p=state.people[i];nameInput.value=p.name;pickedEmoji=p.emoji;renderEmojiGrid();modal.classList.add('show')}
cancel.onclick=()=>modal.classList.remove('show');
save.onclick=()=>{const n=nameInput.value.trim();if(n)state.people[editing].name=n;state.people[editing].emoji=pickedEmoji;persist();modal.classList.remove('show');renderPeople()};
modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};
addPlace.onclick=()=>{const v=customInput.value.trim();if(!v)return;state.places.push(['📍',v,'你們自己加的地點']);customInput.value='';persist();renderPlaces()};
random.onclick=()=>{const p=state.places[Math.floor(Math.random()*state.places.length)];selected=p[1];chosen.textContent='🎲 '+p[1];renderPlaces()};
renderPeople();renderPlaces();
</script>
</body>
</html>
